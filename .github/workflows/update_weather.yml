
name: Update Tokyo taxi weather (OpenWeather 4.0)
on:
  workflow_dispatch:
  schedule:
    - cron: '5,35 * * * *'
permissions:
  contents: write
concurrency:
  group: weather-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch forecasts; keep API key secret
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python scripts/fetch_weather.py
      - name: Commit forecast digest only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update forecast digest"
            git push
          fi

